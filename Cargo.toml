[workspace]
resolver = "3"
members = [
    "crates/luminos-types",
    "crates/luminos-core",
    "crates/luminos-platform",
    "crates/luminos-gpu",
    "crates/luminos-tts",
    "crates/luminos-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/luminos-accessibility/luminos"
homepage = "https://luminos.dev"
authors = ["Luminos Contributors"]
# MSRV tracks the stable toolchain the project actually builds and tests on:
# rust-toolchain.toml pins `channel = "stable"` and CI uses dtolnay/rust-toolchain@stable
# (currently 1.92). The highest MSRV among the pinned direct dependencies is
# image 0.25.10 at 1.88, so 1.92 comfortably satisfies the whole graph.
rust-version = "1.92"

# All external dependencies are pinned to EXACT versions (=x.y.z) as a
# supply-chain hardening measure: every version was the newest release that was
# (a) at least two weeks old and (b) free of any open RUSTSEC advisory or yank
# at the time of pinning (2026-06-03). Do not loosen these to caret ranges.
[workspace.dependencies]
# Serialization
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
toml = "=1.1.2"

# Concurrency and state
arc-swap = "=1.9.1"
crossbeam-channel = "=0.5.15"

# Logging
log = "=0.4.29"
env_logger = "=0.11.10"

# Error handling
thiserror = "=2.0.18"

# Platform abstraction (internal crates)
luminos-types = { path = "crates/luminos-types" }
luminos-platform = { path = "crates/luminos-platform" }
luminos-core = { path = "crates/luminos-core" }
luminos-gpu = { path = "crates/luminos-gpu" }
luminos-tts = { path = "crates/luminos-tts" }

# GPU rendering
bytemuck = { version = "=1.25.0", features = ["derive"] }
wgpu = "=29.0.3"
winit = "=0.30.13"

# Screen capture
xcap = "=0.9.4"
image = "=0.25.10"

# TTS
sherpa-rs = "=0.6.8"
cpal = "=0.17.3"

# Clipboard
arboard = "=3.6.1"

# Application framework
# tauri 2.11.2 patches the Origin Confusion advisory (CVE-2026-42184, fixed in
# 2.11.1). tauri-build is independently versioned and co-released as 2.6.2.
tauri = { version = "=2.11.2", features = ["tray-icon"] }
tauri-build = "=2.6.2"
# tauri-specta / specta-typescript have no stable release; the newest eligible
# prerelease is pinned. rc.25 requires specta-typescript ^0.0.12.
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
# `specta` derive on the IPC-reachable engine types (story 005, DC-5). Lockstep
# with tauri-specta rc.25 (which forces specta = rc.25); previously resolved only
# transitively. Added as a NORMAL (non-optional, non-feature-gated) dep to the
# engine crates so `#[derive(specta::Type)]` compiles even without the app's
# `tauri` feature (`cargo build --workspace --exclude luminos-app` must pass).
specta = { version = "=2.0.0-rc.25", features = ["derive"] }

# X11 protocol (Linux + OpenBSD)
x11rb = { version = "=0.13.2", features = ["randr", "shm", "xinput"] }

# Linux accessibility
atspi = "=0.30.0"

# Async runtime (sync channel only for platform traits)
tokio = { version = "=1.52.3", features = ["sync"] }

# Window handle interop
raw-window-handle = "=0.6.2"

# Sync bridge for the async wgpu device init on the single-threaded event loop
# (no tokio runtime runs on the tao/Tauri loop thread). pollster 0.4.0 is the
# highest release published on or before 2026-05-21, advisory-free and not yanked.
pollster = "=0.4.0"

# POSIX signal handling for graceful SIGTERM/SIGINT shutdown of the event loop
# (Linux/Unix only). Already resolved transitively at this exact version; pinned
# explicitly. Published 2026-04-23, advisory-free, not yanked.
libc = "=0.2.186"

# Platform config directory resolution (XDG on Linux/OpenBSD)
directories = "=6.0.0"

# Test-only: temporary directories/files for filesystem unit tests
tempfile = "=3.27.0"

# Build profiles
[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 16
strip = "debuginfo"

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
