name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "--deny warnings"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            lint-${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libgtk-3-dev
          libsoup-3.0-dev
          javascriptcoregtk-4.1-dev
          libpipewire-0.3-dev
          libasound2-dev
          libx11-dev
          libxi-dev
          libxtst-dev
          libegl-dev
          libgbm-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: >
          cargo clippy
          --workspace --all-targets --all-features
          -- -D warnings
          -W clippy::unwrap_used
          -W clippy::expect_used
          -W clippy::pedantic
          -A clippy::module_name_repetitions

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check licenses and advisories
        run: cargo deny check licenses advisories

  test-rust-unit:
    name: Unit Tests (Rust)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          libpipewire-0.3-dev
          libasound2-dev
          libx11-dev
          libxi-dev
          libxtst-dev
          libegl-dev
          libgbm-dev

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run unit tests
        run: >
          cargo nextest run
          --profile ci
          --workspace
          --exclude luminos-app

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: security-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            security-${{ runner.os }}-cargo-

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check licenses and advisories
        run: cargo deny check licenses advisories

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run vulnerability audit
        run: cargo audit

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          libpipewire-0.3-dev
          libasound2-dev
          libx11-dev
          libxi-dev
          libxtst-dev
          libegl-dev
          libgbm-dev

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: coverage-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            coverage-${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: >
          cargo llvm-cov
          --workspace
          --exclude luminos-app
          --lcov
          --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-platform:
    name: Platform Tests (X11)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          xvfb
          picom
          mesa-utils
          mesa-vulkan-drivers
          libegl-dev
          libgl1-mesa-dri
          libgbm-dev
          libpipewire-0.3-dev
          libasound2-dev
          libx11-dev
          libxi-dev
          libxtst-dev

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: platform-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            platform-${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run platform tests under Xvfb
        run: >
          xvfb-run -s "-screen 0 1920x1080x24" bash -c
          "picom --backend xrender --daemon && cargo nextest run
          --profile ci
          -p luminos-platform
          --features ci_platform_tests"

  test-gpu:
    name: GPU Tests (Mesa llvmpipe)
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      MESA_GL_VERSION_OVERRIDE: "4.5"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          xvfb
          picom
          mesa-utils
          mesa-vulkan-drivers
          libegl-dev
          libgl1-mesa-dri
          libgbm-dev
          libpipewire-0.3-dev
          libasound2-dev
          libx11-dev
          libxi-dev
          libxtst-dev

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gpu-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gpu-${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run GPU tests under Xvfb
        run: >
          xvfb-run -s "-screen 0 1920x1080x24" bash -c
          "picom --backend xrender --daemon && cargo nextest run
          --profile ci
          -p luminos-gpu
          --features ci_platform_tests"

  # --- Placeholder jobs (activated in E2+) ---

  test-shaders:
    name: Shader Tests (placeholder)
    runs-on: ubuntu-latest
    needs: [lint]
    if: false  # Disabled until E2 adds GPU rendering
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # TODO (E2): Install Mesa llvmpipe, set LIBGL_ALWAYS_SOFTWARE=1,
      # run cargo nextest --features ci_platform_tests -E 'test(~shader_)'

  test-integration:
    name: Integration Tests (placeholder)
    runs-on: ubuntu-latest
    needs: [test-rust-unit]
    if: false  # Disabled until E2+ adds platform backends
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
