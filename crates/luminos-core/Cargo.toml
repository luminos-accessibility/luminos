[package]
name = "luminos-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
test_utils = [
    "luminos-types/test_utils",
    "luminos-platform/test_utils",
    "dep:luminos-gpu",
    "luminos-gpu/test_utils",
    "luminos-tts/test_utils",
]

[dependencies]
luminos-types = { workspace = true }
luminos-platform = { workspace = true }
luminos-gpu = { workspace = true, optional = true }
luminos-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
arc-swap = { workspace = true }
crossbeam-channel = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
arboard = { workspace = true }
