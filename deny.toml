[graph]
targets = []
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[advisories]
ignore = [
    # paste is unmaintained (RUSTSEC-2024-0436) — transitive dep via wgpu->metal.
    { id = "RUSTSEC-2024-0436", reason = "transitive dep via wgpu->metal, no upstream fix yet" },

    # ttf-parser is unmaintained (RUSTSEC-2026-0192) — transitive dep via
    # winit->sctk-adwaita->ab_glyph->owned_ttf_parser->ttf-parser. The advisory
    # states no safe upgrade is available (crate abandoned upstream); cannot be
    # resolved until ab_glyph/sctk-adwaita migrate to skrifa.
    { id = "RUSTSEC-2026-0192", reason = "transitive via winit->sctk-adwaita->ab_glyph->ttf-parser, no upstream fix (abandoned)" },

    # Tauri transitive dep advisories — all unmaintained crates pulled in by
    # tauri -> tao -> gtk-rs (GTK3 bindings) and related ecosystem crates.
    # These cannot be resolved until Tauri migrates to GTK4 or alternative backends.
    # GTK3 bindings (gtk, gdk, gdk-pixbuf, atk, pango, glib, gio, cairo, gobject, gdkx11)
    { id = "RUSTSEC-2024-0411", reason = "transitive via tauri->tao->gtk, awaiting GTK4 migration" },
    { id = "RUSTSEC-2024-0412", reason = "transitive via tauri->tao->gtk" },
    { id = "RUSTSEC-2024-0413", reason = "transitive via tauri->tao->gtk" },
    { id = "RUSTSEC-2024-0414", reason = "transitive via tauri->tao->gtk" },
    { id = "RUSTSEC-2024-0415", reason = "transitive via tauri->tao->gtk" },
    { id = "RUSTSEC-2024-0416", reason = "transitive via tauri->tao->gtk" },
    { id = "RUSTSEC-2024-0417", reason = "transitive via tauri->tao->gtk" },
    { id = "RUSTSEC-2024-0418", reason = "transitive via tauri->tao->gtk" },
    { id = "RUSTSEC-2024-0419", reason = "transitive via tauri->tao->gtk" },
    { id = "RUSTSEC-2024-0420", reason = "transitive via tauri->tao->gtk" },
    # proc-macro-error unmaintained — transitive via tauri->tao
    { id = "RUSTSEC-2024-0370", reason = "transitive via tauri->tao->proc-macro-error" },
    # unic-* crates unmaintained — transitive via tauri
    { id = "RUSTSEC-2025-0075", reason = "transitive via tauri->unic-ucd-ident" },
    { id = "RUSTSEC-2025-0080", reason = "transitive via tauri->unic-char-property" },
    { id = "RUSTSEC-2025-0081", reason = "transitive via tauri->unic-char-range" },
    { id = "RUSTSEC-2025-0098", reason = "transitive via tauri->unic-common" },
    { id = "RUSTSEC-2025-0100", reason = "transitive via tauri->unic-ucd-version" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
